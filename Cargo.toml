[package]
name = "forge-lang"
version = "0.9.0"
edition = "2021"
rust-version = "1.85"
description = "Forge — Internet-native programming language with natural syntax, bytecode VM, and built-in HTTP/database/crypto"
license = "MIT"
repository = "https://github.com/humancto/forge-lang"
homepage = "https://github.com/humancto/forge-lang"
keywords = ["language", "programming-language", "interpreter", "vm", "scripting"]
categories = ["compilers", "command-line-utilities"]
readme = "README.md"
exclude = ["docs/book/programming-forge.pdf", "docs/cover.jpeg", "docs/spec/**", "docs/PROGRAMMING_FORGE.md", "docs/part*.md", "benchmarks/**", "spec/**", "bindings/**", "fuzz/**"]

[lib]
name = "forge_lang"
path = "src/lib.rs"
crate-type = ["rlib", "staticlib"]

[[bin]]
name = "forge"
path = "src/main.rs"
# The CLI is the host runtime (HTTP server, databases, shell, LSP, ...).
required-features = ["host"]

[dependencies]
# === Serialization ===
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# === Async Runtime ===
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "sync", "net", "time", "io-util", "signal"], optional = true }

# === HTTP Server (production-grade) ===
axum = { version = "0.8", features = ["ws"], optional = true }
tower = { version = "0.5", optional = true }
tower-http = { version = "0.6", features = ["cors", "trace", "request-id"], optional = true }
# Used by the server's WS handler for per-connection state. parking_lot's
# Mutex doesn't poison and has no Send-across-await hazard with the way
# we hold it (lock guard never crosses an .await).
parking_lot = { version = "0.12", optional = true }

# === Observability ===
# tracing is the structured-logging substrate; tower-http's TraceLayer
# (already enabled above) emits per-request spans into it.
tracing = "0.1"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "json", "fmt"], optional = true }

# === OpenTelemetry / OTLP (opt-in via `otel` feature) ===
# Pinned to 0.31 stack. The OTel Rust ecosystem has historically had
# breaking releases every 1-2 months; this pin keeps the build stable.
# CI runs `cargo build --features otel` so a future incompatible upgrade
# fails fast.
opentelemetry = { version = "0.31", features = ["trace"], optional = true }
opentelemetry_sdk = { version = "0.31", features = ["trace"], optional = true }
opentelemetry-otlp = { version = "0.31", features = ["grpc-tonic", "trace"], optional = true }
tracing-opentelemetry = { version = "0.32", optional = true }

# === HTTP Client (production-grade) ===
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "blocking"], optional = true }

# === CLI & REPL ===
clap = { version = "4", features = ["derive"], optional = true }
rustyline = { version = "15", features = ["derive"], optional = true }

# === Error Reporting ===
ariadne = "0.4"

# === Language Server ===
# rust-analyzer's synchronous LSP scaffold (framing, initialize/shutdown
# handshake) plus typed protocol structs. Small footprint: crossbeam-channel,
# log, serde, fluent-uri, bitflags.
lsp-server = { version = "0.10", optional = true }
lsp-types = { version = "0.97", optional = true }

# === Utilities ===
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
uuid = { version = "1", features = ["v4"] }
indexmap = "2"
toml = "1"

# === Crypto ===
sha2 = "0.10"
md-5 = "0.10"
base64 = "0.22"
hex = "0.4"
hmac = "0.12"
getrandom = "0.2"
# Package-registry signatures (rfcs/0007). Keys are generated from getrandom
# bytes, so the rand_core feature is not needed.
ed25519-dalek = { version = "2.2", default-features = false, features = ["std", "zeroize"], optional = true }

# === URL Parsing ===
url = "2"

# === WebSocket Client ===
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"], optional = true }
futures-util = { version = "0.3", optional = true }

# === Environment ===
dotenvy = "0.15"

# === Regex ===
regex = "1"

# === Database ===
rusqlite = { version = "0.34", features = ["bundled", "limits"], optional = true }
tokio-postgres = { version = "0.7", optional = true }
tokio-postgres-rustls = { version = "0.13", optional = true }
rustls = { version = "0.23", optional = true }
webpki-roots = { version = "1", optional = true }
mysql_async = { version = "0.34", default-features = false, features = ["rustls-tls"], optional = true }
flate2 = { version = "1", optional = true }

# === JWT ===
jsonwebtoken = "9"

# === JIT / Native Compilation (Cranelift) ===
cranelift-codegen = { version = "0.129", optional = true }
cranelift-frontend = { version = "0.129", optional = true }
cranelift-jit = { version = "0.129", optional = true }
cranelift-module = { version = "0.129", optional = true }
cranelift-native = { version = "0.129", optional = true }
gethostname = { version = "1.1.0", optional = true }
semver = "1"
# Native plugins (`import native`, src/plugins). dlopen/LoadLibrary wrapper.
libloading = { version = "0.8", optional = true }
tar = { version = "0.4", optional = true }

# `forge mcp` moves the protocol off fds 0/1 so scripts cannot touch it.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# `wasm32-unknown-unknown` (the browser playground, bindings/wasm) has no OS
# clock or entropy source: take them from the JS host. `std::time::Instant`
# and `SystemTime::now()` panic there, so the core reads the clock through
# `crate::clock`, which re-exports `web-time` on that target only.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
uuid = { version = "1", features = ["v4", "js"] }
web-time = "1"

[features]
default = ["host", "jit", "postgres", "mysql"]
# Everything that needs an operating system: the async runtime and HTTP
# server/client, SQLite, WebSockets, shell and process access, native
# plugins, the package registry, the LSP/DAP/MCP servers and the CLI. On by
# default; turning it off (`--no-default-features`) leaves the portable core
# (lexer, parser, type checker, formatter, interpreter, bytecode VM and the
# pure stdlib) that also builds for `wasm32-unknown-unknown`. Host-only
# stdlib modules and builtins then fail at run time with a clear error
# (see `stdlib::unavailable`), never at compile time of user code.
host = [
    "dep:tokio",
    "dep:axum",
    "dep:tower",
    "dep:tower-http",
    "dep:parking_lot",
    "dep:tracing-subscriber",
    "dep:reqwest",
    "dep:clap",
    "dep:rustyline",
    "dep:lsp-server",
    "dep:lsp-types",
    "dep:tokio-tungstenite",
    "dep:futures-util",
    "dep:rusqlite",
    "dep:libloading",
    "dep:tar",
    "dep:flate2",
    "dep:ed25519-dalek",
    "dep:gethostname",
]
jit = ["cranelift-codegen", "cranelift-frontend", "cranelift-jit", "cranelift-module", "cranelift-native"]
postgres = ["host", "tokio-postgres", "tokio-postgres-rustls", "rustls", "webpki-roots"]
mysql = ["host", "mysql_async"]
# Opt-in OpenTelemetry/OTLP export. Off by default (~30 transitive crates
# including tonic, prost, hyper, h2). Activate at runtime via
# OTEL_EXPORTER_OTLP_ENDPOINT.
otel = [
    "host",
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:tracing-opentelemetry",
]

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = true
strip = true

[profile.bench]
opt-level = 3

[dev-dependencies]
criterion = { version = "0.7.0", features = ["html_reports"] }
# Drives the shared fuzz-target generator in tests/fuzz_smoke.rs.
arbitrary = "1"

[[bench]]
name = "fork_for_serving"
harness = false

[[bench]]
name = "interpreter_hot_paths"
harness = false

[[bench]]
name = "server_throughput"
harness = false
