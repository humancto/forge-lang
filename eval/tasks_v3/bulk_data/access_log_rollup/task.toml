id = "access_log_rollup"
category = "bulk_data"
title = "Roll up a 150,000-line access log"
prompt = """
Standard input is a web server access log of about 150,000 lines. A valid line has exactly
7 fields separated by single spaces:

`<timestamp> <client ip> <method> <path> <status> <latency ms> <bytes>`

for example `2026-03-01T00:00:01Z 10.0.3.7 GET /api/users/123?x=1 200 35 1234`. The
timestamp is `YYYY-MM-DDTHH:MM:SSZ`; status, latency and bytes are non-negative integers
(digits only). Ignore empty lines and lines starting with `#`. Any other line that is not
valid (wrong number of fields, or a status/latency/bytes field that is not all digits) is
malformed: count it and skip it.

The route of a request is its path without the query string (everything from the first
`?`), with every path segment that consists only of digits replaced by `:id`
(`/api/orders/7/items/3?x=1` becomes `/api/orders/:id/items/:id`). A route is identified
by method and route together.

Print, in this order:

1. `requests: <number of valid lines>`
2. `malformed: <number of malformed lines>`
3. `status: 2xx=<n> 3xx=<n> 4xx=<n> 5xx=<n>` (by the first digit of the status)
4. `top routes:` then the 8 routes with the most requests (ties: route text ascending,
   then method ascending), one per line:
   `<method> <route> n=<requests> p50=<p> p95=<p> p99=<p> max=<max latency> 5xx=<requests with status >= 500>`.
   Percentiles use the nearest-rank method on the route's latencies sorted ascending: the
   q-th percentile of n values is the value at 1-based position ceil(q * n / 100).
5. `top clients:` then the 5 client IPs with the most requests as `<ip> <count>` (ties:
   IP text ascending).
6. `peak minute: <YYYY-MM-DDTHH:MM> <count>`: the minute (first 16 characters of the
   timestamp) with the most requests; the earliest one on a tie.
7. `bytes: <sum of the bytes field>`

The program must finish within a few seconds.
"""
stdin_file = "input.txt"
generator = "gen_input.py"
generated_sha256 = { "input.txt" = "4e68188cea694d4bf8b7969bb13d3573e43db0cebafc64daccf43ccdc4b93926" }
needs = []
timeout = 60
# CPU-heavy: runs alone after the other tasks, so its time limit is not
# eaten by contention on a small machine.
timed = true
