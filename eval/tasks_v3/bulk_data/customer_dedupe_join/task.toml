id = "customer_dedupe_join"
category = "bulk_data"
title = "Deduplicate 50,000 customers and join 220,000 orders"
prompt = """
Standard input has two sections. After the line `#customers` come customer lines
`<customer id>,<name>,<email>`; after the line `#orders` come order lines
`<order id>,<customer id>,<amount in cents>,<YYYY-MM-DD>`. Fields never contain commas;
skip empty lines. There are 50,000 customers and 220,000 orders.

Several customer records may belong to one person. Two records are the same person when
their normalized emails are equal. To normalize: trim surrounding spaces and lower-case;
split at the last `@` into local part and domain; drop everything from the first `+` in
the local part; if the domain is `gmail.com` or `googlemail.com`, also remove every `.`
from the local part and use the domain `gmail.com`. Each person is represented by their
record with the smallest customer id (ids are compared as strings); that record's name and
the normalized email describe the person.

An order whose customer id is unknown is an orphan; count it and ignore it. Every other
order belongs to the person of its customer record.

Write money as `<whole>.<cents>` with two cent digits. Print:

```
customers: <customer records>
people: <distinct people>
merged: <customer records minus people>
orders: <order lines>
orphans: <orphan orders>
top spenders:
<person id> <name> <normalized email> orders=<n> total=<sum> first=<earliest date> last=<latest date>
2026 by month:
2026-MM <sum> (<number of orders>)
```

with the 10 people with the largest order total under `top spenders:` (ties: person id
ascending), and one line per month of 2026 that has orders, in month order.

The program must finish within a few seconds.
"""
stdin_file = "input.txt"
generator = "gen_input.py"
generated_sha256 = { "input.txt" = "d0fe0933528804855f0bd515654a3228c6e9816b664ee1a85f8f5618bfc78f79" }
needs = []
timeout = 45
