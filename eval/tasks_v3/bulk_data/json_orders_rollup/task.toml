id = "json_orders_rollup"
category = "bulk_data"
title = "Aggregate 80,000 JSON order lines"
prompt = """
Each line of standard input is one order as a JSON object (about 80,000 lines, some of them
not valid JSON):

```json
{"id": "o000001", "ts": "2026-02-14T10:15:00+02:00",
 "user": {"id": 42, "country": "DE", "tier": "gold"},
 "items": [{"sku": "SKU-007", "qty": 2, "price": 19.99}],
 "coupon": null, "note": "caf\\u00e9"}
```

(each order is on one line). `ts` ends in `Z` or a `+HH:MM` / `-HH:MM` UTC offset;
`coupon` is `null`, `"SAVE10"` or `"FREESHIP"`; `tier` is `free`, `silver` or `gold`;
prices have at most two decimals; `note` is any string (non-ASCII text may be written
raw or as `\\u` escapes).

Skip empty lines. A line that is not valid JSON, an order whose `user` has no `country`,
and an order with an empty `items` array are invalid: count them and ignore them.

For every valid order, its total in cents is the sum over items of `qty` times the price
in cents (the price times 100, rounded to the nearest integer); with coupon `SAVE10`,
subtract 10% of that sum in cents, rounded half up (`(sum + 5) / 10` with integer
division). Write money as `<whole>.<cents>` with two cent digits.

Print `orders: <valid orders>`, then `invalid: <invalid lines>`, then `by country:` and one
line per country, highest revenue first (ties: country code ascending):
`<country> orders=<n> revenue=<sum of its order totals> avg=<revenue / orders>` (the
average in cents rounded half up); then `top skus:` and the 5 SKUs with the largest total
quantity as `<sku> qty=<total>` (ties: SKU ascending); then
`coupons: SAVE10=<n> FREESHIP=<n> none=<n>`; then
`tiers: free=<n> silver=<n> gold=<n>`; then `busiest utc hour: <HH> (<n> orders)`, the
hour of day (00-23, two digits) in UTC with the most orders, the earliest hour on a tie;
then `notes: non-ascii=<orders whose note contains a non-ASCII character> longest=<the
largest number of characters (Unicode code points) in a note>`.

The program must finish within a few seconds.
"""
stdin_file = "input.txt"
generator = "gen_input.py"
