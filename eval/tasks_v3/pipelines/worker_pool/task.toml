id = "worker_pool"
category = "pipelines"
title = "A bounded pool of four workers fed through channels"
prompt = """
Each non-blank line of standard input is a job `<id> <milliseconds> <word>`. Processing a
job takes the given number of milliseconds (simulate the work by sleeping) and produces
`<the word in upper case>/<number of characters in the word>` (for example `café` gives
`CAFÉ/4`).

Process the jobs with a pool of exactly 4 concurrent workers that take jobs from a shared
queue (a worker takes the next job when it finishes one; never more than 4 jobs in
progress). Print one line per job in input order, `<id> -> <result>`, and then
`done: <number of jobs> jobs`.

There are 32 jobs of 150-250 ms (about 6.4 seconds of work in total); the program must
finish within 4 seconds.
"""
