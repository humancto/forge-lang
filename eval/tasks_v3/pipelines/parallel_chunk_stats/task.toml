id = "parallel_chunk_stats"
category = "pipelines"
title = "Per-chunk statistics computed by eight concurrent tasks"
prompt = """
Standard input has about 160,000 lines `<sensor>,<value>` (value an integer, or something
that is not an integer such as `NaN`); ignore blank lines. Split the lines, in order, into
8 chunks of `ceil(lines / 8)` lines each (the last chunk may be shorter) and compute each
chunk's statistics in its own concurrent task:

`chunk <k>: n=<valid values> bad=<invalid values> sum=<sum> min=<min> max=<max>`

(k from 1, printed in chunk order). Then merge the chunk results (do not recompute them
from the lines) and print `all: n=<n> bad=<bad> sum=<sum> min=<min> max=<max>`, and finally
the 3 sensors with the largest sum of values followed by the 3 with the smallest, as
`<sensor> n=<values> sum=<sum>`, all six in order of decreasing sum (ties: sensor name
ascending).

The program must finish within a few seconds.
"""
stdin_file = "input.txt"
generator = "gen_input.py"
generated_sha256 = { "input.txt" = "c695bddba8aec06150bf2c1824e2835d3f4ea0caea1c10c6547cd0129b0142be" }
needs = []
timeout = 40
# CPU-heavy: runs alone after the other tasks, so its time limit is not
# eaten by contention on a small machine.
timed = true
