[[request]]
method = "DELETE"
path = "/kv/greeting"

[[request]]
method = "DELETE"
path = "/kv/greeting"

[[request]]
path = "/kv/greeting"

[[request]]
method = "PUT"
path = "/kv/empty"
body = ""
headers = { "Content-Type" = "text/plain" }
show_headers = ["ETag"]

[[request]]
path = "/kv/empty"
show_headers = ["ETag"]

[[request]]
path = "/kv"
