id = "line_diff"
category = "cli_text"
title = "A line diff tool: changes on stdout, summary on stderr, exit status"
prompt = """
Write a small `diff` tool. Standard input holds two texts separated by a line that is
exactly `=====`: the old text (lines A) before it and the new text (lines B) after it.

Compute a longest common subsequence of the lines with this dynamic program: let
`L[i][j]` be the length of the longest common subsequence of A[i..] and B[j..] (0-based,
`L[n][*] = L[*][m] = 0`). Then walk from i = 0, j = 0 while i < n or j < m:

- if i < n, j < m and A[i] == B[j]: the line is unchanged; i++, j++;
- else if j >= m, or i < n and L[i+1][j] >= L[i][j+1]: print `-<i+1>: <A[i]>` (a deleted
  line, numbered in the old text); i++;
- else print `+<j+1>: <B[j]>` (an inserted line, numbered in the new text); j++.

Then, on standard error, print `<d> deleted, <k> inserted, <u> unchanged` and exit with
status 1 if anything was deleted or inserted; otherwise print nothing on stdout, print
`no differences (<n> lines)` on standard error and exit with status 0.

Texts can have 700 lines each; the program must finish within a few seconds.
"""
needs = []
timeout = 30
# CPU-heavy: runs alone after the other tasks, so its time limit is not
# eaten by contention on a small machine.
timed = true
generator = "gen_input.py"
generated_sha256 = { "big.txt" = "26994e1507c5e850ecfccef40939f858091fb885a7801513592dceb698aaa83f" }

[[case]]
name = "small"
stdin = """
apple
banana
cherry
date
=====
apple
blueberry
cherry
date
elderberry
"""
expected_stdout = """
-2: banana
+2: blueberry
+5: elderberry
"""
expected_stderr = """
1 deleted, 2 inserted, 3 unchanged
"""
exit_code = 1

[[case]]
name = "same"
stdin = """
one
two
=====
one
two
"""
expected_stdout = ""
expected_stderr = """
no differences (2 lines)
"""

[[case]]
name = "empty_old"
stdin = """
=====
new 1
new 2
"""
expected_stdout = """
+1: new 1
+2: new 2
"""
expected_stderr = """
0 deleted, 2 inserted, 0 unchanged
"""
exit_code = 1

