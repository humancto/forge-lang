id = "bigint_calc"
category = "deep_algorithms"
title = "Exact arithmetic on integers with hundreds of digits"
prompt = """
Each non-blank line of standard input is an expression with integers of any size (far
beyond 64 bits). Tokens are separated by spaces. An integer is an optional `-` followed
by digits (leading zeros allowed: `007` is 7, `-0` is 0).

- `<a> + <b>`, `<a> - <b>`, `<a> * <b>`;
- `<a> ^ <n>`: a to the power n (n is digits only; `x ^ 0` is 1);
- `fact <n>`: n factorial (n is digits only; `fact 0` is 1).

Anything else prints `error: bad expression`. For a valid expression print the exact
result in decimal (no leading zeros, `-` only for negative results, zero as `0`),
followed by ` (<number of digits> digits, digit sum <sum of its digits>)` (the sign is not
a digit).

Results have up to about 600 digits; the program must finish within a few seconds.
"""
