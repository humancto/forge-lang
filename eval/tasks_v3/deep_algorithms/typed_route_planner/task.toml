id = "typed_route_planner"
category = "deep_algorithms"
title = "Typed shortest-path route planner with an interface for the metric"
editions = ["2027"]
prompt = """
Write a typed program: declare the types of every function's parameters and result, use
structs for roads and search results, and an interface for the cost metric with two
implementations (distance and time).

Each non-blank line of standard input is a command (words separated by spaces):

- `road <A> <B> <km> <minutes>`: a two-way road between towns A and B (positive integers).
  All roads come before the first query.
- `route <A> <B> distance` or `route <A> <B> time`: find the path from A to B with the
  smallest total km (distance) or total minutes (time) and print
  `<A> -> <town> -> ... -> <B>: <total km> km, <total minutes> min` (both totals along the
  chosen path). If A equals B print `<A>: 0 km, 0 min`. If either town has no roads or B
  cannot be reached, print `no route from <A> to <B>`. The test data has no ties between
  different shortest paths.
- `reachable <A> <limit>`: the towns other than A whose fastest travel time (minutes) from
  A is at most limit. Print `reachable from <A> within <limit> min: <count>`, followed
  (only when count > 0) by ` (nearest: ` and the up to 5 nearest of them as
  `<town> <minutes>` separated by `, ` (by minutes, ties by town name ascending) and `)`.
  A town without roads reaches nothing.
- anything else: print `error: unknown command <first word>`.

There are 300 towns, 900 roads and about 50 queries; the program must finish within a few
seconds.
"""
stdin_file = "input.txt"
generator = "gen_input.py"
