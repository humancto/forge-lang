id = "mini_lisp"
category = "deep_algorithms"
title = "An interpreter for a small Lisp with closures and recursion"
prompt = """
Write an interpreter for a small Lisp. Standard input is a program: a sequence of
top-level forms (they may span lines). Tokens are `(`, `)` and atoms (maximal runs of
characters other than whitespace and parentheses). An atom that is an optional `-`
followed by digits is an integer (64-bit); `#t` and `#f` are booleans; any other atom is a
symbol. The input is always well-formed (parentheses balance).

Evaluation:
- An integer or boolean evaluates to itself; `()` evaluates to the empty list; a symbol
  evaluates to its binding: the innermost local binding, else a global, else the error
  `unbound symbol: <name>`.
- `(if c a b)`: evaluate c; if its value is `#f`, evaluate b, otherwise a (every value
  except `#f` counts as true, including 0 and the empty list).
- `(lambda (p1 p2 ...) body)`: a closure over the current local bindings.
- `(let ((n1 e1) (n2 e2) ...) body)`: evaluate all ei in the outer scope, then body with
  the new bindings added.
- `(begin e1 e2 ...)`: evaluate in order; the value is the last one's.
- `(f a1 a2 ...)`: evaluate f, then the arguments left to right, then call. A closure
  called with the wrong number of arguments is the error
  `arity: expected <n> arguments, got <m>`; calling anything that is not a closure or a
  builtin is `not a function: <value printed>`. The body runs with the closure's
  captured bindings plus the parameters.
- Top-level `(define name expr)` evaluates expr and binds the global name;
  `(define (name p1 ...) body)` binds name to a closure (globals are looked up when used,
  so functions can be recursive and call later definitions).

Builtins (globals): `+` and `*` (any number of integers), `-` (one integer: negate;
more: subtract the rest from the first), `/` (two integers, integer division truncating
toward zero; division by zero is the error `division by zero`), `=`, `<`, `>` (two
integers, give a boolean), `list` (a list of its arguments), `cons x lst` (a new list with
x in front), `car lst` / `cdr lst` (first element / the rest; on an empty list the error
`car of empty list` / `cdr of empty list`), `null?` (whether the argument is the empty
list), `length lst`. An arithmetic or comparison builtin given a non-integer, and a list
builtin given a non-list, is the error `type error in <builtin name>`.

Output: for each top-level form print one line: for a define, the defined name; otherwise
the value. Integers print in decimal, booleans as `#t`/`#f`, lists as `(` elements
separated by single spaces `)` (`()` when empty, nested lists printed the same way),
closures as `<lambda>` and builtins as `<builtin NAME>`. If evaluating a form raises an
error, print `error: <message>` instead and continue with the next form.

Recursion in the programs goes about 1,000 calls deep.
"""
stdin_file = "program.txt"
needs = []
timeout = 30
# CPU-heavy: runs alone after the other tasks, so its time limit is not
# eaten by contention on a small machine.
timed = true
