id = "room_bookings_merge"
category = "data"
title = "Merge 20,000+ room bookings and find free gaps"
prompt = """
Each line of standard input is a booking `<room> <HH:MM>-<HH:MM>` (start before end, both
within 08:00-20:00). There are more than 20,000 lines in no particular order, for a few
dozen rooms.

For each room, merge its bookings into busy blocks: bookings that overlap or touch
(one ends exactly when the next starts) belong to the same block. Then print, for every
room in ascending order:

`<room> blocks=<number of busy blocks> busy=<total busy time> free=<longest free gap>`

where the total busy time is written `<hours>h<MM>m` (minutes two digits, e.g. `3h05m`,
`12h00m`), and the longest free gap is the longest stretch inside 08:00-20:00 not covered by
any block, written `<HH:MM>-<HH:MM>` (the earliest one if several are equally long), or
`none` if the room is busy the whole day.

The program must finish within a few seconds.
"""
stdin_file = "input.txt"
needs = []
