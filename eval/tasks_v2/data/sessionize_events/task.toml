  2026-03-28 21:50:00 -> 2026-03-28 22:20:10 30m10s 4 events
  2026-03-28 22:51:00 -> 2026-03-28 22:51:00 0m00s 1 events
  2026-03-29 00:15:00 -> 2026-03-29 00:15:00 0m00s 1 events
bo: 1 session(s)
  2026-03-28 15:00:00 -> 2026-03-28 15:59:59 59m59s 4 events
cy: 1 session(s)
  2026-03-28 14:00:00 -> 2026-03-28 14:00:00 0m00s 1 events
