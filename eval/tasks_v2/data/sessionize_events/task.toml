id = "sessionize_events"
category = "data"
title = "Group timestamped events into user sessions"
prompt = """
Each line of standard input is `<timestamp> <user> <event>`, where the timestamp is ISO 8601
with a UTC offset, either `Z` or `+HH:MM` / `-HH:MM` (for example `2026-03-28T23:50:00+02:00`).
Lines are not in time order. Blank lines are ignored.

For each user, sort their events by time and split them into sessions: a new session starts
when an event comes more than 30 minutes (strictly more than 1800 seconds) after the
previous event of the same user.

Print the users in ascending order. For each user print `<user>: <n> session(s)`, then one
line per session in time order:

`  <start> -> <end> <duration> <k> events`

where `<start>` and `<end>` are the first and last event times converted to UTC and printed
as `YYYY-MM-DD HH:MM:SS`, `<duration>` is end minus start written as `<minutes>m<ss>s`
(seconds always two digits, for example `0m00s`, `12m05s`, `75m30s`), and `<k>` is the
number of events in the session.
"""
stdin = """
2026-03-28T23:50:00+02:00 ana login
2026-03-28T21:55:10Z ana view
2026-03-28T22:20:10Z ana view
2026-03-28T22:51:00Z ana logout
2026-03-28T10:00:00-05:00 bo login
2026-03-28T15:29:59Z bo view
2026-03-28T16:00:00+01:00 bo view
2026-03-28T14:00:00Z cy login

2026-03-29T00:15:00+00:00 ana login
2026-03-28T15:59:59Z bo logout
2026-03-28T23:59:30Z dee view
2026-03-29T01:30:30+01:00 dee view
2026-03-29T00:00:30Z dee view
2026-03-28T22:20:10Z ana click
"""
needs = []
expected_stdout = """
