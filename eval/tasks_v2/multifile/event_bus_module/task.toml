id = "event_bus_module"
category = "multifile"
title = "Drive a stateful event-bus module with closures"
prompt = '''
Write `main.fg`. The working directory contains the Forge module `events.fg`, an event
bus that keeps its subscriptions in module state. Import it (do not copy its code) and
drive it with the commands on standard input. Its source:

```forge
// events.fg: a tiny in-process event bus. The module keeps its own state:
// the registered handlers, in registration order.

let mut subscriptions = []
let mut next_token = 1

// Register handler (a function taking the payload and returning a value)
// for an event name. Returns a token that identifies the subscription.
fn on(event: String, handler) -> Int {
    let token = next_token
    next_token += 1
    subscriptions = subscriptions + [{ token: token, event: event, handler: handler }]
    return token
}

// Remove a subscription; true if it existed.
fn off(token: Int) -> Bool {
    let before = len(subscriptions)
    subscriptions = filter(subscriptions, fn(s) { return s.token != token })
    return len(subscriptions) < before
}

// Call every handler of the event, in registration order, with the payload.
// Returns the array of their results.
fn publish(event: String, payload) {
    let mut results = []
    for s in subscriptions {
        if s.event == event {
            let h = s.handler
            results.push(h(payload))
        }
    }
    return results
}

fn listener_count(event: String) -> Int {
    return len(filter(subscriptions, fn(s) { return s.event == event }))
}
```

Each non-blank line of standard input is a command:

- `sub <event> upper` / `sub <event> len` / `sub <event> count` / `sub <event> prefix <text>`:
  register a handler for the event with `on` and print `subscribed <token>`. Handlers get
  the payload string: `upper` returns it in upper case, `len` returns its length,
  `prefix <text>` returns text followed by the payload, and `count` returns
  `call #<n>` where n counts the calls of that particular handler (each `count` handler
  has its own counter, starting at 1).
- `pub <event> <payload>`: the payload is the rest of the line after the event name (it
  may contain spaces). Call `publish` and print `<event>: ` followed by the results joined
  with ` | `, or `<event>: no listeners` if there are none.
- `off <token>`: print `removed <token>` if `off` returns true, else `unknown <token>`.
- `count <event>`: print `<event> has <n> listener(s)` using `listener_count`.
'''
stdin = """
sub greet upper
sub greet prefix hello,
sub greet count
pub greet ada lovelace
sub stats count
sub stats len
pub greet bo
pub stats one
pub stats three words here
count greet
off 2
off 2
pub greet cy
sub greet count
pub greet dee
pub missing nothing
count missing
off 99
"""
needs = ["read"]
expected_stdout = """
subscribed 1
subscribed 2
subscribed 3
greet: ADA LOVELACE | hello,ada lovelace | call #1
subscribed 4
subscribed 5
greet: BO | hello,bo | call #2
stats: call #1 | 3
stats: call #2 | 16
greet has 3 listener(s)
removed 2
unknown 2
greet: CY | call #3
subscribed 6
greet: DEE | call #4 | call #1
missing: no listeners
missing has 0 listener(s)
unknown 99
"""
