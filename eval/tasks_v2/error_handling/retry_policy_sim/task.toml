busy: attempt 2 500 -> wait 300ms
busy: ok after 3 attempt(s), waited 2800ms
bad: permanent error 404 after 1 attempt(s)
late: attempt 1 502 -> wait 100ms
late: permanent error 401 after 2 attempt(s)
stuck: attempt 1 timeout -> wait 100ms
stuck: attempt 2 timeout -> wait 300ms
stuck: attempt 3 timeout -> wait 900ms
stuck: attempt 4 timeout -> wait 1000ms
stuck: gave up after 5 attempts, waited 2300ms
mixed: attempt 1 500 -> wait 100ms
mixed: attempt 2 429:50 -> wait 300ms
mixed: attempt 3 429:900 -> wait 900ms
mixed: ok after 4 attempt(s), waited 1300ms
succeeded=4 failed=3 total_wait=6900ms
