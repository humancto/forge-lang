id = "retry_policy_sim"
category = "error_handling"
title = "Simulate a retry policy with backoff, caps and Retry-After"
prompt = """
Simulate (do not actually sleep) a retry policy. The first line of standard input is
`max_attempts=<n> base_ms=<b> factor=<f> cap_ms=<c>` (keys always in this order, integer
values). Each following non-blank line is `<job> <outcomes>`, where outcomes is a
comma-separated list of what each attempt returns, in order (if a job makes more attempts
than listed, the last outcome repeats). An outcome is:

- `ok`: success;
- `timeout`, `429`, or any status from `500` to `599`: a transient error (retry);
- any other 3-digit status: a permanent error (stop, no retry);
- `429:<ms>`: a transient error whose server asks to wait at least `<ms>` milliseconds.

Before retry k (k = 1 for the second attempt) wait `min(cap, base * factor^(k-1))` ms, or
the server's requested wait if that is larger (the cap does not apply to it). A job makes
at most max_attempts attempts.

For each job print one line per failed attempt that is retried,
`<job>: attempt <i> <outcome> -> wait <ms>ms` (the outcome as written), then one of:
`<job>: ok after <attempts> attempt(s), waited <total ms>ms`,
`<job>: permanent error <status> after <attempts> attempt(s)`,
`<job>: gave up after <attempts> attempts, waited <total ms>ms` (last attempt transient).
Finally print `succeeded=<n> failed=<n> total_wait=<ms>ms`.
"""
stdin = """
max_attempts=5 base_ms=100 factor=3 cap_ms=1000
fast ok
flaky timeout,503,ok
busy 429:2500,500,ok
bad 404
late 502,401
stuck timeout
mixed 500,429:50,429:900,ok
"""
