id = "jsonl_status_counts"
category = "json_csv"
title = "Aggregate JSON lines"
prompt = """
Standard input is JSON Lines: one JSON object per line describing an HTTP request with
`path`, `status` (integer) and `ms` (integer duration). Print, for each path in alphabetical
order, `<path>: <count> requests, <errors> errors, avg <avg>ms` where errors are statuses >= 500
and avg is the mean duration rounded down to an integer. Then print `slowest: <path> <ms>ms`
for the single slowest request (the first one on a tie).
"""
stdin = """
{"path": "/api/users", "status": 200, "ms": 31}
{"path": "/api/orders", "status": 500, "ms": 1200}
{"path": "/api/users", "status": 404, "ms": 12}
{"path": "/health", "status": 200, "ms": 1}
{"path": "/api/orders", "status": 201, "ms": 88}
{"path": "/api/users", "status": 503, "ms": 1200}
{"path": "/api/orders", "status": 200, "ms": 95}
"""
needs = []
expected_stdout = """
/api/orders: 3 requests, 1 errors, avg 461ms
/api/users: 3 requests, 1 errors, avg 414ms
/health: 1 requests, 0 errors, avg 1ms
slowest: /api/orders 1200ms
"""
