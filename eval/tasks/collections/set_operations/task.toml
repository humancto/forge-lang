id = "set_operations"
category = "collections"
title = "Set algebra on two lists"
prompt = """
Standard input has two lines of integers separated by spaces (duplicates possible).
Treating each line as a set, print four lines with the elements sorted ascending and separated
by spaces (an empty result prints nothing after the colon):
`union: ...`, `intersection: ...`, `only first: ...`, `only second: ...`.
"""
stdin = """
5 1 3 3 9 12 7 -2
3 4 5 6 7 7 20 -2
"""
needs = []
expected_stdout = """
union: -2 1 3 4 5 6 7 9 12 20
intersection: -2 3 5 7
only first: 1 9 12
only second: 4 6 20
"""
