id = "merge_intervals"
category = "algorithms"
title = "Merge intervals"
prompt = """
Each line of standard input is an interval `a-b` of integers with a <= b (negative numbers are
written like `-5--2`). Merge all overlapping or touching intervals (touching means the next one
starts at most 1 after the previous end, e.g. 1-3 and 4-6 merge into 1-6). Print the merged
intervals in ascending order, one per line as `[a, b]`, then `covered: <total number of
integers covered>`.
"""
stdin = """
5-8
1-3
4-4
10-12
-5--2
11-15
20-20
-1-0
"""
needs = []
expected_stdout = """
[-5, 8]
[10, 15]
[20, 20]
covered: 21
"""
