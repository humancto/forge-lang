<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forge Playground</title>
<meta name="description" content="Run Forge in your browser: an editor, the full language core compiled to WebAssembly, and a guided tour. Nothing to install.">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230a192f'/%3E%3Cpath d='M9 8h14v4H13v3h8v4h-8v5H9z' fill='%23ff6b35'/%3E%3C/svg%3E">
<link rel="stylesheet" href="playground.css">
<link rel="modulepreload" href="playground.js">
</head>
<body>
<a class="skip" href="#editor">Skip to the editor</a>

<header class="topbar">
  <a class="brand" href="../" title="Forge home">
    <span class="logo" aria-hidden="true">F</span>
    <span>Forge <span class="brand-sub">Playground</span></span>
  </a>
  <nav class="actions" aria-label="Playground">
    <button id="tour-toggle" type="button" aria-expanded="false" aria-controls="tour">Tour</button>
    <label class="select">
      <span class="visually-hidden">Load an example</span>
      <select id="examples">
        <option value="">Examples…</option>
      </select>
    </label>
    <label class="select">
      <span class="visually-hidden">Engine</span>
      <select id="engine" title="Execution engine">
        <option value="auto">Auto (VM)</option>
        <option value="vm">Bytecode VM</option>
        <option value="interp">Interpreter</option>
      </select>
    </label>
    <button id="format" type="button" disabled title="Format (Ctrl/⌘ + Shift + F)">Format</button>
    <button id="share" type="button" title="Copy a link to this code">Share</button>
    <button id="theme" type="button" aria-pressed="false" class="icon" title="Toggle dark theme">
      <span class="visually-hidden">Dark theme</span>
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z"/></svg>
    </button>
    <button id="run" type="button" class="primary" disabled aria-label="Run the program (Ctrl or Command + Enter)">Run</button>
  </nav>
</header>

<main class="layout">
  <aside id="tour" class="tour" hidden aria-labelledby="tour-title">
    <div class="tour-head">
      <span id="tour-progress" class="tour-progress"></span>
      <button id="tour-close" type="button" class="link" aria-label="Close the tour">Close</button>
    </div>
    <div class="tour-meter" aria-hidden="true"><div id="tour-bar"></div></div>
    <h2 id="tour-title" tabindex="-1"></h2>
    <div id="tour-body" class="tour-body"></div>
    <p id="tour-done" class="tour-done" hidden>Nice — that ran. Tweak it, or carry on.</p>
    <div class="tour-nav">
      <button id="tour-prev" type="button">← Back</button>
      <button id="tour-reset" type="button" class="link">Reset code</button>
      <button id="tour-next" type="button" class="primary">Next →</button>
    </div>
  </aside>

  <section class="pane editor-pane" aria-label="Editor">
    <div id="editor"></div>
    <p id="editor-help" class="hint">
      <kbd>Ctrl</kbd>/<kbd>⌘</kbd>+<kbd>Enter</kbd> run · <kbd>Tab</kbd> indents (<kbd>Esc</kbd> then <kbd>Tab</kbd> leaves the editor) · <span id="version">Forge</span>
    </p>
  </section>

  <section class="pane output-pane" aria-label="Results">
    <div class="pane-head">
      <h2>Output</h2>
      <span id="status" class="status" role="status" aria-live="polite"></span>
    </div>
    <pre id="output" class="output" tabindex="0" aria-label="Program output" aria-busy="false"></pre>
    <div class="pane-head">
      <h2>Problems</h2>
      <span id="problems-count" class="status"></span>
    </div>
    <ul id="problems-list" class="problems"></ul>
  </section>
</main>

<div id="toast" class="toast" role="status" hidden></div>

<script type="module" src="playground.js"></script>
</body>
</html>
