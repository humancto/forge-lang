[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "forge-lang"
description = "Run untrusted Forge code from Python in a deny-by-default sandbox"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["sandbox", "agents", "code-execution", "llm", "forge"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Rust",
    "Topic :: Security",
    "Topic :: Software Development :: Interpreters",
    "Typing :: Typed",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/humancto/forge-lang"
Source = "https://github.com/humancto/forge-lang/tree/main/bindings/python"
Changelog = "https://github.com/humancto/forge-lang/blob/main/CHANGELOG.md"

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.maturin]
# Mixed Rust/Python layout: python/forge_lang/ is the package and the
# compiled extension is forge_lang._native.
python-source = "python"
module-name = "forge_lang._native"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]
